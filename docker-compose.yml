# Bases de démonstration : docker compose up -d
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ged
      MYSQL_USER: ged
      MYSQL_PASSWORD: ged
    ports: ["3306:3306"]

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Ged_Passw0rd!"
    ports: ["1433:1433"]
    # Créer la base une fois : docker compose exec sqlserver /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Ged_Passw0rd!' -C -Q "CREATE DATABASE ged"
